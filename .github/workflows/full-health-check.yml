name: Full health check (one-time)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Container health
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            echo "=== docker compose ps ==="
            docker compose -f ~/docker-compose.yml --project-directory /opt/rigoo-marine-prod ps
            echo ""
            echo "=== OOM / restart check ==="
            docker inspect $(docker compose -f ~/docker-compose.yml \
              --project-directory /opt/rigoo-marine-prod ps -q) \
              --format "{{.Name}}  OOM={{.State.OOMKilled}}  Restarts={{.RestartCount}}  Status={{.State.Status}}" \
              2>/dev/null | sort
          '

      - name: Public API test (correct port)
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            echo "=== client-service listening ports ==="
            docker exec client-service sh -c "ss -tlnp 2>/dev/null | grep java || netstat -tlnp 2>/dev/null | grep java"

            echo ""
            echo "=== /api/public/* via gateway (30s timeout) ==="
            curl -s --max-time 30 -o /dev/null -w "contact-info: HTTP %{http_code}\n" \
              http://localhost:8080/api/public/contact-info
            curl -s --max-time 30 -o /dev/null -w "team:         HTTP %{http_code}\n" \
              http://localhost:8080/api/public/team
            curl -s --max-time 30 -o /dev/null -w "gallery:      HTTP %{http_code}\n" \
              http://localhost:8080/api/public/gallery
          '

      - name: Notification-service crash logs
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            echo "=== notification-service restart count + last 30 log lines ==="
            docker inspect notification-service \
              --format "OOM={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Restarts={{.RestartCount}}" \
              2>/dev/null
            docker logs notification-service --tail=30 2>&1
          '
