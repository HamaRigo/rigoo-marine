name: Deploy to Development

on:
  workflow_run:
    workflows: ["Backend CI/CD", "Frontend CI/CD"]
    types:
      - completed
    branches: [develop]

env:
  DOCKER_COMPOSE_VERSION: '2.20'

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEV_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to development server
        run: |
          ssh ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER_HOST }} << 'EOF'
            cd /opt/rigoo-marine-dev

            # Pull latest images
            docker compose pull

            # Deploy with latest images
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            # Show status
            docker compose ps
          EOF

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 30
          curl -f http://${{ secrets.DEV_SERVER_HOST }}:8080/actuator/health || echo "Gateway health check failed"
