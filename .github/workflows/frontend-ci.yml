name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'rigoo-marine-frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'rigoo-marine-frontend/**'

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: rigoo-marine-frontend/package-lock.json

      - name: Install dependencies
        working-directory: rigoo-marine-frontend
        run: npm ci

      - name: Run ESLint
        working-directory: rigoo-marine-frontend
        run: npm run lint

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: rigoo-marine-frontend/package-lock.json

      - name: Install dependencies
        working-directory: rigoo-marine-frontend
        run: npm ci

      - name: Build
        working-directory: rigoo-marine-frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: rigoo-marine-frontend/dist

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-frontend
          file: ./rigoo-marine-frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/marine-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/marine-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/marine-frontend:buildcache,mode=max
