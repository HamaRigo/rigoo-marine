name: Check container health (one-time)

on:
  workflow_dispatch:

jobs:
  check:
    name: docker compose ps
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Live container status
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            docker compose -f ~/docker-compose.yml --project-directory /opt/rigoo-marine-prod ps
            echo ""
            echo "=== OOM / restart check ==="
            docker inspect $(docker compose -f ~/docker-compose.yml --project-directory /opt/rigoo-marine-prod ps -q) \
              --format "{{.Name}}  OOMKilled={{.State.OOMKilled}}  Restarts={{.RestartCount}}  Status={{.State.Status}}" 2>/dev/null | sort
          '
