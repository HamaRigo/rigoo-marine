name: Fix canonical path ownership (one-time)

on:
  workflow_dispatch:

jobs:
  fix:
    name: Chown /opt/rigoo-marine-prod/docker-compose.yml
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Fix ownership via Docker volume mount
        run: |
          # sudo is not passwordless on this server, but the deploy user has
          # Docker socket access. A throwaway busybox container (running as
          # root inside the container) can chown host files through a volume
          # mount without any sudo privilege.
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            set -e
            DEPLOY_UID=$(id -u)
            DEPLOY_GID=$(id -g)
            echo "Deploy user: $(id) — fixing ownership of /opt/rigoo-marine-prod/docker-compose.yml"
            docker run --rm \
              -v /opt/rigoo-marine-prod:/target \
              busybox \
              chown ${DEPLOY_UID}:${DEPLOY_GID} /target/docker-compose.yml
            echo "Result:"
            ls -la /opt/rigoo-marine-prod/docker-compose.yml
          '
