name: Backend CI/CD

on:
  push:
    branches: [main, develop, production]
    paths:
      - 'rigoo-marine-backend/**'
  pull_request:
    branches: [main, develop, production]
    paths:
      - 'rigoo-marine-backend/**'
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Xmx2g"
  DOCKER_IMAGE_PREFIX: rigoomarine

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: rigoo-marine-backend
        run: mvn clean verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: rigoo-marine-backend/**/target/surefire-reports/

  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      common: ${{ steps.changes.outputs.common }}
      gateway: ${{ steps.changes.outputs.gateway }}
      client: ${{ steps.changes.outputs.client }}
      vessel: ${{ steps.changes.outputs.vessel }}
      service: ${{ steps.changes.outputs.service }}
      work-order: ${{ steps.changes.outputs.work-order }}
      technician: ${{ steps.changes.outputs.technician }}
      invoice: ${{ steps.changes.outputs.invoice }}
      notification: ${{ steps.changes.outputs.notification }}
      discovery: ${{ steps.changes.outputs.discovery }}
      delivery: ${{ steps.changes.outputs.delivery }}
      marketplace: ${{ steps.changes.outputs.marketplace }}
      shop: ${{ steps.changes.outputs.shop }}
      maintenance: ${{ steps.changes.outputs.maintenance }}

    steps:
      - uses: actions/checkout@v4

      - name: Path filter (push only)
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            common:
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            gateway:
              - 'rigoo-marine-backend/gateway-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            client:
              - 'rigoo-marine-backend/client-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            vessel:
              - 'rigoo-marine-backend/vessel-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            service:
              - 'rigoo-marine-backend/service-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            work-order:
              - 'rigoo-marine-backend/work-order-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            technician:
              - 'rigoo-marine-backend/technician-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            invoice:
              - 'rigoo-marine-backend/invoice-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            notification:
              - 'rigoo-marine-backend/notification-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            discovery:
              - 'rigoo-marine-backend/discovery-service/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            delivery:
              - 'rigoo-marine-backend/delivery-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            marketplace:
              - 'rigoo-marine-backend/marketplace-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            shop:
              - 'rigoo-marine-backend/shop-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'
            maintenance:
              - 'rigoo-marine-backend/maintenance-module/**'
              - 'rigoo-marine-backend/common-security/**'
              - 'rigoo-marine-backend/common-exceptions/**'

      - name: Set outputs
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            for svc in common gateway client vessel service work-order technician invoice notification discovery delivery marketplace shop maintenance; do
              echo "${svc}=true" >> "$GITHUB_OUTPUT"
            done
          else
            echo "common=${{ steps.filter.outputs.common }}"           >> "$GITHUB_OUTPUT"
            echo "gateway=${{ steps.filter.outputs.gateway }}"         >> "$GITHUB_OUTPUT"
            echo "client=${{ steps.filter.outputs.client }}"           >> "$GITHUB_OUTPUT"
            echo "vessel=${{ steps.filter.outputs.vessel }}"           >> "$GITHUB_OUTPUT"
            echo "service=${{ steps.filter.outputs.service }}"         >> "$GITHUB_OUTPUT"
            echo "work-order=${{ steps.filter.outputs.work-order }}"   >> "$GITHUB_OUTPUT"
            echo "technician=${{ steps.filter.outputs.technician }}"   >> "$GITHUB_OUTPUT"
            echo "invoice=${{ steps.filter.outputs.invoice }}"         >> "$GITHUB_OUTPUT"
            echo "notification=${{ steps.filter.outputs.notification }}" >> "$GITHUB_OUTPUT"
            echo "discovery=${{ steps.filter.outputs.discovery }}"     >> "$GITHUB_OUTPUT"
            echo "delivery=${{ steps.filter.outputs.delivery }}"       >> "$GITHUB_OUTPUT"
            echo "marketplace=${{ steps.filter.outputs.marketplace }}" >> "$GITHUB_OUTPUT"
            echo "shop=${{ steps.filter.outputs.shop }}"               >> "$GITHUB_OUTPUT"
            echo "maintenance=${{ steps.filter.outputs.maintenance }}" >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    name: Build & Push Docker Images
    # Native arm64 — no QEMU, no emulation overhead
    runs-on: self-hosted
    needs: detect-changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Discovery Service
        if: needs.detect-changes.outputs.discovery == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/discovery-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/discovery-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/discovery-service:latest

      - name: Build and push API Gateway
        if: needs.detect-changes.outputs.gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/gateway-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest

      - name: Build and push Client Service
        if: needs.detect-changes.outputs.client == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/client-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/client-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/client-service:latest

      - name: Build and push Vessel Service
        if: needs.detect-changes.outputs.vessel == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/vessel-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vessel-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/vessel-service:latest

      - name: Build and push Service Service
        if: needs.detect-changes.outputs.service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/service-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/service-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/service-service:latest

      - name: Build and push Work Order Service
        if: needs.detect-changes.outputs.work-order == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/work-order-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/work-order-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/work-order-service:latest

      - name: Build and push Technician Service
        if: needs.detect-changes.outputs.technician == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/technician-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/technician-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/technician-service:latest

      - name: Build and push Invoice Service
        if: needs.detect-changes.outputs.invoice == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/invoice-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/invoice-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/invoice-service:latest

      - name: Build and push Notification Service
        if: needs.detect-changes.outputs.notification == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/notification-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest

      - name: Build and push Delivery Service
        if: needs.detect-changes.outputs.delivery == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/delivery-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/delivery-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/delivery-service:latest

      - name: Build and push Marketplace Service
        if: needs.detect-changes.outputs.marketplace == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/marketplace-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-service:latest

      - name: Build and push Shop Service
        if: needs.detect-changes.outputs.shop == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/shop-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-service:latest

      - name: Build and push Maintenance Service
        if: needs.detect-changes.outputs.maintenance == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./rigoo-marine-backend
          file: ./rigoo-marine-backend/maintenance-module/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/maintenance-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/maintenance-service:latest

  deploy:
    name: Deploy changed services
    runs-on: self-hosted
    needs: [docker-build, detect-changes]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/production') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix deploy dir ownership
        run: sudo chown -R "$(whoami):" /opt/rigoo-marine-prod

      - name: Sync docker-compose.yml
        run: cp docker-compose.yml /opt/rigoo-marine-prod/docker-compose.yml

      - name: Pull and restart updated services
        env:
          HUB: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${HUB}" --password-stdin

          CHANGED_SERVICES=""
          add() { CHANGED_SERVICES="$CHANGED_SERVICES $1"; }

          [ "${{ needs.detect-changes.outputs.discovery }}"   = "true" ] && add discovery-service   || true
          [ "${{ needs.detect-changes.outputs.gateway }}"     = "true" ] && add api-gateway          || true
          [ "${{ needs.detect-changes.outputs.client }}"      = "true" ] && add client-service       || true
          [ "${{ needs.detect-changes.outputs.vessel }}"      = "true" ] && add vessel-service       || true
          [ "${{ needs.detect-changes.outputs.service }}"     = "true" ] && add service-service      || true
          [ "${{ needs.detect-changes.outputs.work-order }}"  = "true" ] && add work-order-service   || true
          [ "${{ needs.detect-changes.outputs.technician }}"  = "true" ] && add technician-service   || true
          [ "${{ needs.detect-changes.outputs.invoice }}"     = "true" ] && add invoice-service      || true
          [ "${{ needs.detect-changes.outputs.notification }}" = "true" ] && add notification-service || true
          [ "${{ needs.detect-changes.outputs.delivery }}"    = "true" ] && add delivery-service     || true
          [ "${{ needs.detect-changes.outputs.marketplace }}" = "true" ] && add marketplace-service  || true
          [ "${{ needs.detect-changes.outputs.shop }}"        = "true" ] && add shop-service         || true
          [ "${{ needs.detect-changes.outputs.maintenance }}" = "true" ] && add maintenance-service  || true

          if [ -z "$CHANGED_SERVICES" ]; then
            echo "No services changed — nothing to restart."
            exit 0
          fi

          echo "Restarting:$CHANGED_SERVICES"
          for svc in $CHANGED_SERVICES; do
            docker pull ${HUB}/${svc}:latest
          done

          docker compose \
            -f /opt/rigoo-marine-prod/docker-compose.yml \
            --env-file /opt/rigoo-marine-prod/.env \
            up -d --force-recreate --no-deps \
            $CHANGED_SERVICES

          echo "Done. Waiting 30s then checking health..."
          sleep 30
          docker compose \
            -f /opt/rigoo-marine-prod/docker-compose.yml \
            --env-file /opt/rigoo-marine-prod/.env \
            ps
