name: Final check (one-time)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Health + public API
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            echo "=== docker compose ps ==="
            docker compose -f ~/docker-compose.yml --project-directory /opt/rigoo-marine-prod ps

            echo ""
            echo "=== OOM / restart check ==="
            docker inspect $(docker compose -f ~/docker-compose.yml \
              --project-directory /opt/rigoo-marine-prod ps -q) \
              --format "{{.Name}}  OOM={{.State.OOMKilled}}  Restarts={{.RestartCount}}  Status={{.State.Status}}" \
              2>/dev/null | sort

            echo ""
            echo "=== public API (30s timeout) ==="
            curl -s --max-time 30 -w "\ncontact-info: HTTP %{http_code}\n" \
              http://localhost:8080/api/public/contact-info
            curl -s --max-time 30 -o /dev/null -w "team: HTTP %{http_code}\n" \
              http://localhost:8080/api/public/team
            curl -s --max-time 30 -o /dev/null -w "gallery: HTTP %{http_code}\n" \
              http://localhost:8080/api/public/gallery
          '
