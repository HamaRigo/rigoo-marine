name: Configure SMTP Mail (one-time)

# Triggered manually. Updates .env on the production server with Gmail SMTP
# credentials, syncs docker-compose.yml, restarts the two mail-sending services,
# then runs an end-to-end test.
#
# DELETE this workflow after mail is confirmed working.

on:
  workflow_dispatch:

jobs:
  configure-mail:
    name: Configure SMTP + verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync docker-compose.yml to server
        run: |
          base64 -w 0 docker-compose.yml | \
            ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            'base64 -d > ~/docker-compose.yml && cp ~/docker-compose.yml /opt/rigoo-marine-prod/docker-compose.yml'

      - name: Update .env with mail settings
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASSWORD }}
        run: |
          # Mask the value so it never appears in GH Actions log output
          echo "::add-mask::${MAIL_PASS}"

          # Build the update script on the runner (password substituted here,
          # masked in logs), ship it over scp, execute, self-delete.
          cat > /tmp/update_mail.sh << SCRIPT
          #!/bin/bash
          set -e
          ENV=/opt/rigoo-marine-prod/.env

          upsert() {
            local k=\$1 v=\$2
            if grep -q "^\${k}=" "\$ENV"; then
              sed -i "s|^\${k}=.*|\${k}=\${v}|" "\$ENV"
            else
              echo "\${k}=\${v}" >> "\$ENV"
            fi
          }

          upsert MAIL_ENABLED          true
          upsert MAIL_FROM             rigoomarine@gmail.com
          upsert SPRING_MAIL_HOST      smtp.gmail.com
          upsert SPRING_MAIL_PORT      587
          upsert SPRING_MAIL_USERNAME  rigoomarine@gmail.com
          upsert SPRING_MAIL_PASSWORD  ${MAIL_PASS}
          upsert FRONTEND_BASE_URL     https://rigoomarine.com

          chmod 600 "\$ENV"
          rm -f /tmp/update_mail.sh
          echo ".env updated OK"
          SCRIPT

          scp /tmp/update_mail.sh \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }}:/tmp/update_mail.sh
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            'bash /tmp/update_mail.sh'

      - name: Restart mail-sending services
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /opt/rigoo-marine-prod
            export $(grep -v '^#' .env | xargs)
            docker compose up -d --force-recreate --no-deps client-service notification-service
            echo "Polling until client-service actuator is healthy (up to 3 min)..."
            for i in $(seq 1 36); do
              if curl -sf --max-time 4 http://localhost:8081/actuator/health > /dev/null 2>&1; then
                echo "client-service healthy after ${i}x5s"
                break
              fi
              sleep 5
            done
            docker compose ps client-service notification-service
          ENDSSH

      - name: End-to-end mail test
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e
            cd /opt/rigoo-marine-prod

            echo "=== Triggering password-reset ==="
            curl -sf --max-time 15 \
              -X POST https://api.rigoomarine.com/auth/forgot-password \
              -H "Content-Type: application/json" \
              -d '{"email":"mohamed.bouallagui001@gmail.com"}' && echo "" \
              || echo "(curl returned non-zero — check logs below)"

            sleep 15

            echo "=== client-service SMTP logs ==="
            docker compose logs client-service --tail=80 2>&1 \
              | grep -iE "mail\.sent|SMTP|535|auth|ERROR|Exception|reset-password|rigoomarine\.com|localhost" \
              || echo "(no matching lines)"

            echo "=== notification-service SMTP logs ==="
            docker compose logs notification-service --tail=80 2>&1 \
              | grep -iE "mail\.sent|SMTP|535|auth|ERROR|Exception" \
              || echo "(no matching lines)"
          ENDSSH
