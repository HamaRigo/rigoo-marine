name: Validate public API endpoints (one-time)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Test public endpoints inside container and through gateway
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            echo "=== curl inside client-service container ==="
            docker exec client-service curl -si http://localhost:8081/api/public/contact-info | head -5
            echo ""
            docker exec client-service curl -si http://localhost:8081/api/public/team | head -5
            echo ""
            docker exec client-service curl -si http://localhost:8081/api/public/gallery | head -5
            echo ""
            echo "=== curl through gateway (internal) ==="
            curl -si http://localhost:8080/api/public/contact-info | head -5
            echo ""
            echo "=== gateway container status ==="
            docker compose -f ~/docker-compose.yml --project-directory /opt/rigoo-marine-prod ps client-service
          '
