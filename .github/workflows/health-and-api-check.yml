name: Health and API check (one-time)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Container health + public API test
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'REMOTE'
            set -e
            echo "=== docker compose ps ==="
            docker compose -f ~/docker-compose.yml --project-directory /opt/rigoo-marine-prod ps

            echo ""
            echo "=== OOM / restart check ==="
            docker inspect $(docker compose -f ~/docker-compose.yml \
              --project-directory /opt/rigoo-marine-prod ps -q) \
              --format "{{.Name}}  OOM={{.State.OOMKilled}}  Restarts={{.RestartCount}}  Status={{.State.Status}}" \
              2>/dev/null | sort

            echo ""
            echo "=== /api/public/contact-info (direct on client-service) ==="
            CPORT=$(docker inspect client-service \
              --format '{{range $p,$conf := .NetworkSettings.Ports}}{{$p}}={{(index $conf 0).HostPort}} {{end}}' \
              2>/dev/null | tr ' ' '\n' | grep "8081\|tcp" | head -1 || true)
            docker exec client-service curl -sf http://localhost:8081/api/public/contact-info \
              -w "\nHTTP %{http_code}" || echo "FAILED"

            echo ""
            echo "=== /api/public/team ==="
            docker exec client-service curl -sf http://localhost:8081/api/public/team \
              -w "\nHTTP %{http_code}" || echo "FAILED"

            echo ""
            echo "=== /api/public/gallery ==="
            docker exec client-service curl -sf http://localhost:8081/api/public/gallery \
              -w "\nHTTP %{http_code}" || echo "FAILED"

            echo ""
            echo "=== /api/public/contact-info through gateway ==="
            curl -sf http://localhost:8080/api/public/contact-info \
              -w "\nHTTP %{http_code}" || echo "FAILED (gateway)"
          REMOTE
