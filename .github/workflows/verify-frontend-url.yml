name: Verify frontend bundle URL (one-time)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts
      - name: Grep bundle for API base URL
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            echo "=== searching JS bundles in marine-frontend container ==="
            docker exec marine-frontend sh -c \
              "grep -ro \"api\.rigoomarine\.com\|localhost:8080\" /usr/share/nginx/html/assets/*.js 2>/dev/null | head -5 || echo no match"
            echo ""
            echo "=== live curl: GET https://api.${{ secrets.PROD_DOMAIN }}/api/services ==="
            curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
              -H "Origin: https://${{ secrets.PROD_DOMAIN }}" \
              https://api.${{ secrets.PROD_DOMAIN }}/api/services || echo "curl failed (exit $?)"
          '
