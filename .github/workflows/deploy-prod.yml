name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  DOCKER_TAG: ${{ github.event.inputs.tag || 'latest' }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/opt/rigoo-marine-prod/"

      - name: Pull all images and redeploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          envs: DOCKER_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          timeout: 600s
          script: |
            set -euo pipefail

            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

            echo "Deploying tag: ${DOCKER_TAG}"

            for svc in discovery-service api-gateway client-service vessel-service \
                       service-service work-order-service technician-service invoice-service \
                       notification-service delivery-service marketplace-service shop-service \
                       maintenance-service marine-frontend; do
              docker pull "${DOCKERHUB_USERNAME}/${svc}:${DOCKER_TAG}"
            done

            docker compose \
              -f /opt/rigoo-marine-prod/docker-compose.yml \
              --env-file /opt/rigoo-marine-prod/.env \
              up -d --force-recreate --remove-orphans

            echo "Waiting 60s for services to start..."
            sleep 60

            docker compose \
              -f /opt/rigoo-marine-prod/docker-compose.yml \
              --env-file /opt/rigoo-marine-prod/.env \
              ps

            docker image prune -f

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ secrets.PROD_DOMAIN }}/actuator/health || echo "API health check failed"
          curl -f https://rigoomarine.com/ || echo "Frontend health check failed"

      - name: Collect diagnostics on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            docker compose -f /opt/rigoo-marine-prod/docker-compose.yml \
              --env-file /opt/rigoo-marine-prod/.env ps
            for svc in discovery-service client-service api-gateway; do
              echo "=== $svc ==="
              docker logs $svc --tail=40 2>&1 || true
            done
