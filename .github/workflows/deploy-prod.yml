name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  DOCKER_IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_TAG: ${{ github.event.inputs.tag || 'latest' }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Pull images and deploy
        env:
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
          HUB: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # 1. Write compose file to home dir (always writable).
          # 2. Also install it to the canonical path via sudo tee so that any
          #    manual `docker compose up` from /opt/rigoo-marine-prod/ uses the
          #    current production config, not a stale copy.
          # 3. Run all compose commands with -f ~/docker-compose.yml
          #    --project-directory /opt/rigoo-marine-prod so .env and named
          #    volumes resolve from the correct root regardless of sudo outcome.
          base64 -w 0 docker-compose.yml | \
            ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            'base64 -d | tee ~/docker-compose.yml | sudo tee /opt/rigoo-marine-prod/docker-compose.yml > /dev/null'
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} bash << EOF
            set -e

            echo "Deploying tag: ${DOCKER_TAG}"
            echo "=== Verifying compose file memory limits ==="
            grep -E "mem_limit|MaxRAMPercentage" ~/docker-compose.yml

            docker pull ${HUB}/api-gateway:${DOCKER_TAG}
            docker pull ${HUB}/client-service:${DOCKER_TAG}
            docker pull ${HUB}/vessel-service:${DOCKER_TAG}
            docker pull ${HUB}/service-service:${DOCKER_TAG}
            docker pull ${HUB}/work-order-service:${DOCKER_TAG}
            docker pull ${HUB}/technician-service:${DOCKER_TAG}
            docker pull ${HUB}/invoice-service:${DOCKER_TAG}
            docker pull ${HUB}/notification-service:${DOCKER_TAG}
            docker pull ${HUB}/discovery-service:${DOCKER_TAG}
            docker pull ${HUB}/delivery-service:${DOCKER_TAG}
            docker pull ${HUB}/marketplace-service:${DOCKER_TAG}
            docker pull ${HUB}/shop-service:${DOCKER_TAG}
            docker pull ${HUB}/maintenance-service:${DOCKER_TAG}

            export DOCKER_TAG=${DOCKER_TAG}
            docker compose -f ~/docker-compose.yml \
              --project-directory /opt/rigoo-marine-prod \
              down --remove-orphans 2>/dev/null || true
            docker compose -f ~/docker-compose.yml \
              --project-directory /opt/rigoo-marine-prod \
              up -d --force-recreate --remove-orphans

            echo "Waiting for services to be healthy..."
            sleep 60

            docker compose -f ~/docker-compose.yml \
              --project-directory /opt/rigoo-marine-prod \
              ps
            docker image prune -f
          EOF

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ secrets.PROD_DOMAIN }}/actuator/health || echo "API health check failed"
          curl -f https://${{ secrets.PROD_DOMAIN }}/ || echo "Frontend health check failed"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} bash << 'DIAG'
            echo "=== compose file memory limits ==="
            grep -E "mem_limit|MaxRAMPercentage" ~/docker-compose.yml
            echo "=== docker compose ps ==="
            docker compose -f ~/docker-compose.yml --project-directory /opt/rigoo-marine-prod ps
            echo "=== discovery-service OOM check ==="
            docker inspect discovery-service \
              --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}} RestartCount={{.RestartCount}} Memory={{.HostConfig.Memory}}' 2>/dev/null || true
            echo "=== discovery-service last 40 log lines ==="
            docker logs discovery-service --tail=40 2>&1 || true
            echo "=== api-gateway inspect ==="
            docker inspect rigoo-marine-prod-api-gateway-1 \
              --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}} RestartCount={{.RestartCount}} Memory={{.HostConfig.Memory}}' 2>/dev/null || true
            echo "=== api-gateway last 40 log lines ==="
            docker logs rigoo-marine-prod-api-gateway-1 --tail=40 2>&1 || true
          DIAG

      - name: Notify on failure
        if: failure()
        run: echo "Production deployment failed! Check GitHub Actions for details."
