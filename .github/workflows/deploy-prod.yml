name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  DOCKER_TAG: ${{ github.event.inputs.tag || 'latest' }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix deploy dir ownership
        run: sudo chown -R "$(whoami):" /opt/rigoo-marine-prod

      - name: Sync docker-compose.yml
        run: cp docker-compose.yml /opt/rigoo-marine-prod/docker-compose.yml

      - name: Pull all images and redeploy
        env:
          HUB: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_TAG: ${{ env.DOCKER_TAG }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${HUB}" --password-stdin

          echo "Deploying tag: ${DOCKER_TAG}"

          for svc in discovery-service api-gateway client-service vessel-service \
                     service-service work-order-service technician-service invoice-service \
                     notification-service delivery-service marketplace-service shop-service \
                     maintenance-service marine-frontend; do
            docker pull ${HUB}/${svc}:${DOCKER_TAG}
          done

          docker compose \
            -f /opt/rigoo-marine-prod/docker-compose.yml \
            --env-file /opt/rigoo-marine-prod/.env \
            up -d --force-recreate --remove-orphans

          echo "Waiting 60s for services to start..."
          sleep 60

          docker compose \
            -f /opt/rigoo-marine-prod/docker-compose.yml \
            --env-file /opt/rigoo-marine-prod/.env \
            ps

          docker image prune -f

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ secrets.PROD_DOMAIN }}/actuator/health || echo "API health check failed"
          curl -f https://${{ secrets.PROD_DOMAIN }}/ || echo "Frontend health check failed"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose -f /opt/rigoo-marine-prod/docker-compose.yml --env-file /opt/rigoo-marine-prod/.env ps
          for svc in discovery-service client-service api-gateway; do
            echo "=== $svc ==="
            docker logs $svc --tail=40 2>&1 || true
          done
