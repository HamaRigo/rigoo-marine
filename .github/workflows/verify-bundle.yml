name: Verify bundle URL (one-time)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts
      - name: Grep bundle
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            echo "=== api.rigoomarine.com occurrences in bundle ==="
            docker exec marine-frontend sh -c \
              "grep -rl \"api\.rigoomarine\.com\" /usr/share/nginx/html/assets/ 2>/dev/null || echo MISSING"
            echo ""
            echo "=== localhost:8080 occurrences in bundle (should be zero) ==="
            docker exec marine-frontend sh -c \
              "grep -rl \"localhost:8080\" /usr/share/nginx/html/assets/ 2>/dev/null || echo NONE - clean"
          '
