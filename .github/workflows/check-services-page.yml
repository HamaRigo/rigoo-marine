name: Check services page (one-time)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Check /api/services endpoint + frontend bundle
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SERVER_HOST }} '
            echo "=== GET /api/services through gateway ==="
            curl -s --max-time 15 http://localhost:8080/api/services \
              -w "\nHTTP %{http_code}" | head -3

            echo ""
            echo "=== localhost:8080 bundle has no localhost:8080 baseURL ==="
            docker exec marine-frontend sh -c \
              "grep -rl \"localhost:8080\" /usr/share/nginx/html/assets/*.js 2>/dev/null | grep -v \".map\" || echo CLEAN"

            echo ""
            echo "=== api.rigoomarine.com in bundle ==="
            docker exec marine-frontend sh -c \
              "grep -rl \"api\.rigoomarine\.com\" /usr/share/nginx/html/assets/*.js 2>/dev/null || echo MISSING"
          '

      - name: Check live HTTPS endpoints
        run: |
          echo "=== https://rigoomarine.com/ ==="
          curl -sf --max-time 15 -o /dev/null -w "HTTP %{http_code}\n" \
            https://${{ secrets.PROD_DOMAIN }}/ || echo "FAILED"

          echo "=== https://api.rigoomarine.com/api/services ==="
          curl -sf --max-time 15 \
            -H "Origin: https://${{ secrets.PROD_DOMAIN }}" \
            https://api.${{ secrets.PROD_DOMAIN }}/api/services \
            -w "\nHTTP %{http_code}\n" | tail -3
