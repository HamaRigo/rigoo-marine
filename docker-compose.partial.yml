services:
  # Netflix Eureka - Service Discovery
  discovery-service:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/discovery-service:latest
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - marine-network

  # Config Server
  config-server:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - marine-network

  # API Gateway
  api-gateway:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - marine-network

  # Client Service
  client-service:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/client-service:latest
    container_name: client-service
    ports:
      - "8081:8081"
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rigoomarine
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - marine-network

  # Invoice Service
  invoice-service:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/invoice-service:latest
    container_name: invoice-service
    ports:
      - "8085:8085"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rigoomarine
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - marine-network

  # PostgreSQL Database (SECURED - internal network only, no external port)
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=rigoomarine
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Flyway handles migrations - no init script needed
    # ports:  # REMOVED for security - DB not exposed externally
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d rigoomarine"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marine-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - marine-network

  # Frontend (React)
  frontend:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/marine-frontend:latest
    container_name: marine-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - marine-network

networks:
  marine-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
