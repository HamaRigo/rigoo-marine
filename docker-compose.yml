  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   ports:
  #     - "9200:9200"
  #     - "9300:9300"
  #   volumes:
  #     - elasticsearch-data:/usr/share/elasticsearch/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - marine-network

  # Logstash (commented out - enable if Elasticsearch is needed)
  # logstash:
  #   image: logstash:8.11.0
  #   container_name: logstash
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy
  #   volumes:
  #     - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
  #     - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
  #   ports:
  #     - "5044:5044"
  #     - "9600:9600"
  #   networks:
  #     - marine-network

  # Kibana (commented out - enable if Elasticsearch is needed)
  # kibana:
  #   image: kibana:8.11.0
  #   container_name: kibana
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  #   ports:
  #     - "5601:5601"
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - marine-network

  # Filebeat (commented out - enable if Elasticsearch is needed)
  # filebeat:
  #   image: elastic/filebeat:8.11.0
  #   container_name: filebeat
  #   user: root
  #   volumes:
  #     - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   networks:
  #     - marine-network

  # Frontend (React) — served by Nginx on host, this container is optional when using Vercel
  frontend:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/marine-frontend:${DOCKER_TAG:-latest}
    build:
      context: ./rigoo-marine-frontend
    container_name: marine-frontend
    ports:
      - "127.0.0.1:3080:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 128m
    mem_reservation: 64m
    networks:
      - marine-network
    restart: unless-stopped

networks:
  marine-network:
    driver: bridge

volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  redis-data:
  elasticsearch-data:
  uploads-data:
