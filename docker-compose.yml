services:
  # Netflix Eureka - Service Discovery
  discovery-service:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/discovery-service:${DOCKER_TAG:-latest}
    build:
      context: ./rigoo-marine-backend
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    # Port not exposed externally — only gateway and services need Eureka
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=55 -XX:InitialRAMPercentage=20 -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      - SPRING_PROFILES_ACTIVE=prod
    mem_limit: 768m
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - marine-network
    restart: unless-stopped

  # API Gateway — the ONLY service with an external port (Nginx terminates SSL in front)
  # container_name removed so `docker compose up --scale api-gateway=2` works.
  # To scale: uncomment `deploy:` below. Each instance needs ~1.5 GiB so two
  # instances require 3 GiB — verify host has headroom before enabling.
  # deploy:
  #   replicas: 2
  api-gateway:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/api-gateway:${DOCKER_TAG:-latest}
    build:
      context: ./rigoo-marine-backend
      dockerfile: gateway-module/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      # Gateway uses 50% (not 60%) so Netty off-heap buffers fit in the remaining headroom
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=20 -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SPRING_PROFILES_ACTIVE=prod
    mem_limit: 1536m
    mem_reservation: 1200m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    networks:
      - marine-network
    restart: unless-stopped

  # Client Service (internal, no exposed port)
  client-service:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/client-service:${DOCKER_TAG:-latest}
    build:
      context: ./rigoo-marine-backend
      dockerfile: client-module/Dockerfile
    container_name: client-service
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=55 -XX:InitialRAMPercentage=20 -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rigoomarine
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      # Public base URL used to build /uploads/* links in API responses.
      # Must be the externally reachable API root (the URL Nginx exposes to the internet),
      # NOT the internal gateway port. Example: https://api.rigoomarine.qa
      - SERVER_BASE_URL=${PUBLIC_API_URL}
      # Frontend origin used in outbound email links (password-reset, verification).
      # Must match the live site domain so links resolve correctly for the user.
      - PUBLIC_BASE_URL=${FRONTEND_BASE_URL}
      # Outbound mail — mirrors notification-service so both services share one
      # SMTP credential set from .env.
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@rigoomarine.qa}
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=9081
      - FILE_UPLOAD_DIR=/app/uploads
      - APP_LOG_SENDER_ALLOW_IN_PROD=${APP_LOG_SENDER_ALLOW_IN_PROD:-true}
      - DB_POOL_MAX_SIZE=5
      - DB_POOL_MIN_IDLE=1
    mem_limit: 768m
    mem_reservation: 600m
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    networks:
      - marine-network
    restart: unless-stopped

