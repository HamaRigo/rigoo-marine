services:
  # Netflix Eureka - Service Discovery
  discovery-service:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/discovery-service:${DOCKER_TAG:-latest}
    build:
      context: ./rigoo-marine-backend
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    # Port not exposed externally — only gateway and services need Eureka
    environment:
      # Was unset — the JVM sized its heap off the whole VM, making Eureka the
      # fattest OOM target. Cap it and bound the container.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40
    mem_limit: 420m
    mem_reservation: 320m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - marine-network
    restart: unless-stopped

  # API Gateway — the ONLY service with an external port (Nginx terminates SSL in front)
  api-gateway:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/api-gateway:${DOCKER_TAG:-latest}
    build:
      context: ./rigoo-marine-backend
      dockerfile: gateway-module/Dockerfile
    container_name: api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    mem_limit: 560m
    mem_reservation: 420m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    networks:
      - marine-network
    restart: unless-stopped

  # Client Service (internal, no exposed port)
  client-service:
    image: ${DOCKERHUB_USERNAME:-rigoomarine}/client-service:${DOCKER_TAG:-latest}
    build:
      context: ./rigoo-marine-backend
      dockerfile: client-module/Dockerfile
    container_name: client-service
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rigoomarine
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
    mem_limit: 900m
    mem_reservation: 700m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    networks:
