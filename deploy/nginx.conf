# Rigoo Marine — Nginx reverse proxy + SSL termination
# Place at /etc/nginx/sites-available/rigoomarine on the production server
# symlink: ln -s /etc/nginx/sites-available/rigoomarine /etc/nginx/sites-enabled/

# Map for WebSocket upgrade header — must be at http{} scope, outside server blocks
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.rigoomarine.com rigoomarine.com www.rigoomarine.com;
    return 301 https://$host$request_uri;
}

# Redirect www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rigoomarine.com;

    ssl_certificate     /etc/letsencrypt/live/rigoomarine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rigoomarine.com/privkey.pem;

    return 301 https://rigoomarine.com$request_uri;
}

# Frontend (React) — apex domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rigoomarine.com;

    ssl_certificate     /etc/letsencrypt/live/rigoomarine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rigoomarine.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# API Gateway — backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rigoomarine.com;

    ssl_certificate     /etc/letsencrypt/live/api.rigoomarine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rigoomarine.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       $connection_upgrade;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check endpoint — no auth, no rate limit
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        access_log off;
    }
}
