server:
  port: ${SERVER_PORT:0}

spring:
  application:
    name: invoice-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # database 1 must match api-gateway + client-service so the JWT revocation
      # list (key: jwt:revoked:<jti>) is readable here.
      database: ${REDIS_DATABASE:1}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rigoomarine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      keepalive-time: 600000
      leak-detection-threshold: 60000
      connection-init-sql: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_invoice
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  cache:
    type: redis
    redis:
      time-to-live: 300000
  cloud:
    loadbalancer:
      configurations: health-check
      health-check:
        initial-delay: 0
        interval: 25s
        path:
          default: /actuator/health
        port:
          shop-service: 8089

management:
  server:
    port: 8085
  health:
    redis:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${random.uuid}
    health-check-url: http://${eureka.instance.ip-address}:${management.server.port}/actuator/health
    status-page-url: http://${eureka.instance.ip-address}:${management.server.port}/actuator/info
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    com.rigoomarine.invoice: DEBUG

jwt:
  secret: ${JWT_SECRET}

stripe:
  # `sk_test_…` from the Stripe dashboard (test mode). Used by future API calls.
  secret-key: ${STRIPE_SECRET_KEY:}
  # `whsec_…` from a Stripe CLI session (`stripe listen`) or a registered endpoint.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# Shared secret for inter-service callback authentication (invoice → shop).
# Both modules must agree on this value. Override in production via INTERNAL_API_TOKEN.
shop:
  internal-api-token: ${INTERNAL_API_TOKEN:rigoo-internal-token-change-in-production}
