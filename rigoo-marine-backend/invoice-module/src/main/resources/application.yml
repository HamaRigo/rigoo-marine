server:
  port: 8085

spring:
  application:
    name: invoice-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rigoomarine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    table: flyway_schema_history_invoice
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.rigoomarine.invoice: DEBUG

jwt:
  secret: ${JWT_SECRET:rigoo-marine-secret-key-change-in-production-12345}

stripe:
  # `sk_test_…` from the Stripe dashboard (test mode). Used by future API calls.
  secret-key: ${STRIPE_SECRET_KEY:}
  # `whsec_…` from a Stripe CLI session (`stripe listen`) or a registered endpoint.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# Shared secret for inter-service callback authentication (invoice → shop).
# Both modules must agree on this value. Override in production via INTERNAL_API_TOKEN.
shop:
  internal-api-token: ${INTERNAL_API_TOKEN:rigoo-internal-token-change-in-production}
