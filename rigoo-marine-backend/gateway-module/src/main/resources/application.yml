server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/plain

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      database: 1  # Different database from client service
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS,PATCH
            allowedHeaders: '*'
            allowCredentials: true
            maxAge: 3600
      httpclient:
        connect-timeout: 3000
        response-timeout: 15s
        pool:
          max-idle-time: 30s
          max-connections: 500
          pending-acquire-timeout: 45s
      default-filters:
        # GET-only retry. POSTs (login, register, otp/request) are NOT
        # idempotent — retrying them would double-send SMS or duplicate signups.
        - name: Retry
          args:
            retries: 2
            methods: GET
            series: SERVER_ERROR
            exceptions:
              - org.springframework.cloud.gateway.support.NotFoundException
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-login-ratelimit
          uri: lb://client-service
          predicates:
            - Path=/auth/login
            - Method=POST
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/auth/${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@ipKeyResolver}"
        - id: auth-forgot-password-ratelimit
          uri: lb://client-service
          predicates:
            - Path=/auth/forgot-password
            - Method=POST
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/auth/${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                key-resolver: "#{@ipKeyResolver}"
        - id: auth-reset-password-ratelimit
          uri: lb://client-service
          predicates:
            - Path=/auth/reset-password
            - Method=POST
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/auth/${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@ipKeyResolver}"
        # Per-IP gate on register. The per-phone-prefix gate lives in the
        # controller (Redis bucket on first 6 digits of the E.164 phone) so
        # numbering walks are bounded even when the attacker rotates IPs.
        - id: auth-register-ratelimit
          uri: lb://client-service
          predicates:
            - Path=/auth/register
            - Method=POST
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/auth/${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@ipKeyResolver}"
        - id: auth-passthrough
          uri: lb://client-service
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/auth/${segment}
        - id: public-unsubscribe
          # One-click email unsubscribe — public, token-authenticated at the
          # controller. No rate limit needed (one click per recipient).
          uri: lb://client-service
          predicates:
            - Path=/unsubscribe
        - id: client-uploads
          # Uploaded files (gallery images, avatars, service photos).
          # Publicly accessible — no auth filter. Must come before client-service
          # route so /uploads/** is not swallowed by /api/clients/** matching.
          uri: lb://client-service
          predicates:
            - Path=/uploads/**
        - id: public-info
          # Public read-only data served by client-service — no rate limit needed
          # (responses are small + cached; contact info page loads are idempotent).
          uri: lb://client-service
          predicates:
            - Path=/api/public/**
        - id: auth-service
          uri: lb://client-service
          predicates:
            - Path=/api/auth/**
        - id: admin-service
          uri: lb://client-service
          predicates:
            - Path=/admin/**
        - id: technician-dashboard
          uri: lb://technician-service
          predicates:
            - Path=/technician/**
        - id: team-lead-dashboard
          uri: lb://technician-service
          predicates:
            - Path=/team-lead/**
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/api/clients/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: vessel-service
          uri: lb://vessel-service
          predicates:
            - Path=/api/vessels/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: service-service
          uri: lb://service-service
          predicates:
            - Path=/api/services/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
        - id: service-request-ratelimit
          uri: lb://work-order-service
          predicates:
            - Path=/api/work-orders/service-request
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                key-resolver: "#{@userKeyResolver}"
        - id: work-order-service
          uri: lb://work-order-service
          predicates:
            - Path=/api/work-orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: technician-service
          uri: lb://technician-service
          predicates:
            - Path=/api/technicians/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: invoice-service
          uri: lb://invoice-service
          predicates:
            - Path=/api/invoices/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"
        - id: quotation-service
          uri: lb://invoice-service
          predicates:
            - Path=/api/quotations/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"
        # Stripe webhooks — public, signature-authenticated. Generous IP-keyed limit
        # to absorb event bursts without dropping (Stripe retries on 5xx anyway).
        - id: payments-stripe-webhook
          uri: lb://invoice-service
          predicates:
            - Path=/api/payments/webhooks/stripe
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@ipKeyResolver}"
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: inventory-service
          uri: lb://work-order-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        - id: vessel-inspection-service
          uri: lb://maintenance-service
          predicates:
            - Path=/api/vessel-inspections/**
        - id: maintenance-service
          uri: lb://maintenance-service
          predicates:
            - Path=/api/maintenance/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        # Marketplace — strict rate limit on the public inquiry POST (anti-spam),
        # normal IP-keyed limit on the public catalog (browse + detail).
        - id: marketplace-inquiry-create-ratelimit
          uri: lb://marketplace-service
          predicates:
            - Path=/api/listings/inquiries
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                key-resolver: "#{@ipKeyResolver}"
        - id: marketplace-service
          uri: lb://marketplace-service
          predicates:
            - Path=/api/listings/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
        # Shop — strict rate limit on the public inquiry POST (anti-spam, mirrors marketplace),
        # normal IP-keyed limit on the public catalog (browse + detail).
        - id: shop-inquiry-create-ratelimit
          uri: lb://shop-service
          predicates:
            - Path=/api/products/inquiries
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                key-resolver: "#{@ipKeyResolver}"
        - id: shop-service
          uri: lb://shop-service
          predicates:
            - Path=/api/products/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
        # Shop checkout — strict per-user limit (anti-abuse on Stripe Session creation).
        - id: shop-checkout-ratelimit
          uri: lb://shop-service
          predicates:
            - Path=/api/orders/checkout
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@userKeyResolver}"
        # Shop cart + orders — auth-gated (cart UI), normal user-keyed limit.
        - id: shop-cart-and-orders
          uri: lb://shop-service
          predicates:
            - Path=/api/cart/**,/api/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        # Shop admin endpoints — order inbox. ADMIN role enforced at controller via @PreAuthorize.
        - id: shop-admin
          uri: lb://shop-service
          predicates:
            - Path=/api/admin/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        # Team requests — public POST (guest + auth'd clients). Strict IP-keyed rate
        # limit mirrors marketplace inquiry: 1 rps burst-3 to block form spammers.
        - id: team-requests-submit-ratelimit
          uri: lb://client-service
          predicates:
            - Path=/api/team-requests
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                key-resolver: "#{@ipKeyResolver}"
        # Team requests admin — list, status updates, stats. ADMIN/TEAM_LEAD enforced at
        # controller via @PreAuthorize; user-keyed limit for normal admin traffic.
        - id: team-requests-admin
          uri: lb://client-service
          predicates:
            - Path=/api/admin/team-requests/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        # Team requests — technician assigned list + respond endpoints.
        # Must come AFTER the POST rate-limited route so that exact POST /api/team-requests
        # is still caught by the stricter upstream rule.
        - id: team-requests-technician
          uri: lb://client-service
          predicates:
            - Path=/api/team-requests/**
        # Delivery — tech task/position endpoints + admin task management.
        # Meta WhatsApp webhook — public, HMAC-verified at the controller.
        # Must be accessible without authentication so Meta can POST delivery receipts.
        - id: whatsapp-webhook
          uri: lb://notification-service
          predicates:
            - Path=/whatsapp/webhook
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/delivery/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10   # default 30 — recover faster after a discovery blip
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    root: WARN
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
