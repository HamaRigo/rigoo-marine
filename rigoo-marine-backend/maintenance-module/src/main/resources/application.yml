server:
  port: 8091

internal:
  api-token: ${INTERNAL_API_TOKEN:rigoo-internal-token-change-in-production}

spring:
  application:
    name: maintenance-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # database 1 must match api-gateway + client-service so the JWT revocation
      # list (key: jwt:revoked:<jti>) is readable here.
      database: ${REDIS_DATABASE:1}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rigoomarine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      keepalive-time: 600000
      leak-detection-threshold: 60000
      connection-init-sql: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_maintenance
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: maintenance-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # We deserialise both maintenance.service-due and workorder.completed
        # events as generic Maps — keeps this module decoupled from the
        # publishing modules' class paths.
        spring.json.value.default.type: java.util.LinkedHashMap
        spring.json.use.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.rigoomarine.maintenance: DEBUG

jwt:
  secret: ${JWT_SECRET:rigoo-marine-secret-key-change-in-production-12345}

# Maintenance feature toggles. The reminder scheduler runs nightly in
# Asia/Qatar; tune the look-ahead and re-notify cooldown without redeploying.
app:
  maintenance:
    reminders:
      enabled: ${MAINTENANCE_REMINDERS_ENABLED:true}
      look-ahead-days: 14
      hours-tolerance: 10
      renotify-cooldown-days: 7
      # Spring cron — sec min hour dom mon dow. Default 03:00 Asia/Qatar.
      cron: "0 0 3 * * *"
      zone: Asia/Qatar
    kafka:
      topic: maintenance.service-due.v1
    pdf:
      # Arabic-capable TrueType font for the dossier PDF. "auto" probes
      # common system paths (Linux fonts-noto-core, macOS GeezaPro, Windows
      # Arial); set to a specific path to skip the probe, or leave empty to
      # disable (Arabic dossiers fall back to Helvetica with substitution
      # boxes for Arabic codepoints).
      arabic-font-path: ${MAINTENANCE_PDF_ARABIC_FONT:auto}
