server:
  port: ${SERVER_PORT:0}

spring:
  application:
    name: shop-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # database 1 must match api-gateway + client-service so the JWT revocation
      # list (key: jwt:revoked:<jti>) is readable here.
      database: ${REDIS_DATABASE:1}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rigoomarine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      keepalive-time: 600000
      leak-detection-threshold: 60000
      connection-init-sql: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_shop
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  cache:
    type: redis
    redis:
      time-to-live: 300000

management:
  server:
    port: 8089
  health:
    redis:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    health-check-url: http://${spring.application.name}:${management.server.port}/actuator/health
    status-page-url: http://${spring.application.name}:${management.server.port}/actuator/info
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    com.rigoomarine.shop: WARN

jwt:
  secret: ${JWT_SECRET}

stripe:
  # Test-mode keys: sk_test_… / whsec_… from the Stripe dashboard.
  # Empty defaults so the stack still boots without Stripe — checkout returns 503.
  secret-key: ${STRIPE_SECRET_KEY:}

# Frontend base URL used for Stripe Checkout success/cancel redirects.
shop:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  internal-api-token: ${INTERNAL_API_TOKEN:rigoo-internal-token-change-in-production}
