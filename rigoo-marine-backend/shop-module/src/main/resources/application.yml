server:
  port: 8089

spring:
  application:
    name: shop-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # database 1 must match api-gateway + client-service so the JWT revocation
      # list (key: jwt:revoked:<jti>) is readable here.
      database: ${REDIS_DATABASE:1}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rigoomarine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_shop
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.rigoomarine.shop: DEBUG

jwt:
  secret: ${JWT_SECRET:rigoo-marine-secret-key-change-in-production-12345}

stripe:
  # Test-mode keys: sk_test_… / whsec_… from the Stripe dashboard.
  # Empty defaults so the stack still boots without Stripe — checkout returns 503.
  secret-key: ${STRIPE_SECRET_KEY:}

# Frontend base URL used for Stripe Checkout success/cancel redirects.
shop:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  internal-api-token: ${INTERNAL_API_TOKEN:rigoo-internal-token-change-in-production}
