server:
  port: 8087

spring:
  application:
    name: notification-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # database 1 must match api-gateway + client-service so the JWT revocation
      # list (key: jwt:revoked:<jti>) is readable here.
      database: ${REDIS_DATABASE:1}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rigoomarine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history_notification
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # Deserialize shop.order.status events as a generic Map — notification-service
        # doesn't need shop-module classes on its classpath.
        spring.json.value.default.type: java.util.LinkedHashMap
        spring.json.use.type.headers: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.example.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Mail toggle — flip MAIL_ENABLED=true and populate SPRING_MAIL_* once SMTP provider is provisioned.
# When false (default), LogMailSender writes the email to stdout instead.
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@rigoomarine.qa}
  # WhatsApp — two providers supported.
  #
  # provider=twilio (default): routes through Twilio Messaging API.
  # provider=meta:             routes directly through Meta Cloud API (Graph v19).
  #
  # Set WHATSAPP_ENABLED=true and WHATSAPP_PROVIDER=twilio|meta in the
  # deployment environment; supply the matching credential vars below.
  # ServiceDueEventConsumer fans WhatsApp messages out to opted-in
  # recipients alongside email + in-app notifications.
  whatsapp:
    enabled:  ${WHATSAPP_ENABLED:false}
    # provider=log  → logs to stdout (dev/test, no credentials needed)
    # provider=twilio → Twilio Messaging API (set WHATSAPP_TWILIO_* vars)
    # provider=meta  → Meta Cloud API (set WHATSAPP_META_* vars)
    provider: ${WHATSAPP_PROVIDER:twilio}

    # ── Twilio credentials (used when provider=twilio) ──
    twilio:
      account-sid: ${WHATSAPP_TWILIO_ACCOUNT_SID:}
      auth-token:  ${WHATSAPP_TWILIO_AUTH_TOKEN:}
      from:        ${WHATSAPP_TWILIO_FROM:}

    # ── Meta Cloud API credentials (used when provider=meta) ──
    # phone-number-id: the numeric ID of the WABA phone number (not the
    #   display number itself) — found in Meta Business Manager → WhatsApp →
    #   Phone numbers.
    # access-token: a permanent System User token scoped to whatsapp_business_messaging.
    # verify-token: an arbitrary secret you set in Business Manager when
    #   registering the webhook URL — must match what Meta sends on verification.
    meta:
      phone-number-id: ${WHATSAPP_META_PHONE_NUMBER_ID:}
      access-token:    ${WHATSAPP_META_ACCESS_TOKEN:}
      verify-token:    ${WHATSAPP_META_VERIFY_TOKEN:rigoo-meta-webhook-secret}

# Disable mail health probe — default points at smtp.example.com which would drag /actuator/health DOWN.
management:
  health:
    mail:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.rigoomarine.notification: DEBUG

jwt:
  secret: ${JWT_SECRET:rigoo-marine-secret-key-change-in-production-12345}
