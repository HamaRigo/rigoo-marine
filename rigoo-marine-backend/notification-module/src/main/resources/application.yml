server:
  port: 8087

spring:
  application:
    name: notification-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # database 1 must match api-gateway + client-service so the JWT revocation
      # list (key: jwt:revoked:<jti>) is readable here.
      database: ${REDIS_DATABASE:1}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rigoomarine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    table: flyway_schema_history_notification
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # Deserialize shop.order.status events as a generic Map — notification-service
        # doesn't need shop-module classes on its classpath.
        spring.json.value.default.type: java.util.LinkedHashMap
        spring.json.use.type.headers: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.example.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Mail toggle — flip MAIL_ENABLED=true and populate SPRING_MAIL_* once SMTP provider is provisioned.
# When false (default), LogMailSender writes the email to stdout instead.
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@rigoomarine.qa}
  # WhatsApp via Twilio. Disabled by default — when enabled the bean is
  # @ConditionalOnProperty'd into context and ServiceDueEventConsumer fans
  # WhatsApp messages out to opted-in recipients alongside email + in-app.
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    twilio:
      account-sid: ${WHATSAPP_TWILIO_ACCOUNT_SID:}
      auth-token:  ${WHATSAPP_TWILIO_AUTH_TOKEN:}
      from:        ${WHATSAPP_TWILIO_FROM:}

# Disable mail health probe — default points at smtp.example.com which would drag /actuator/health DOWN.
management:
  health:
    mail:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.rigoomarine.notification: DEBUG

jwt:
  secret: ${JWT_SECRET:rigoo-marine-secret-key-change-in-production-12345}
