server:
  port: 8081
  base-url: ${SERVER_BASE_URL:http://localhost:8081}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

spring:
  application:
    name: client-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rigoomarine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      leak-detection-threshold: 60000
      connection-init-sql: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    table: flyway_schema_history_client
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        order_inserts: true
        order_updates: true
        jdbc:
          timeout: ${DB_QUERY_TIMEOUT:30}
  cache:
    type: redis
    redis:
      time-to-live: 3600000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      # database 1 holds the cross-service JWT revocation list (key: jwt:revoked:<jti>).
      # Must match the api-gateway's spring.data.redis.database — otherwise the gateway
      # filter reads from a db this service never writes to and revocations silently drop.
      database: ${REDIS_DATABASE:1}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.example.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

db:
  pool:
    max-size: ${DB_POOL_MAX_SIZE:20}
    min-idle: ${DB_POOL_MIN_IDLE:5}
    idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
    connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
    max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
  ssl:
    enabled: ${DB_SSL_ENABLED:false}
    root-cert: ${DB_SSL_ROOT_CERT:}
  query-timeout: ${DB_QUERY_TIMEOUT:30000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.rigoomarine.client: DEBUG

jwt:
  secret: ${JWT_SECRET:rigoo-marine-secret-key-change-in-production-12345}
  expiration: 86400000

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@rigoomarine.qa}

management:
  endpoint:
    health:
      show-details: always
  health:
    # Mail HealthIndicator probes SMTP at startup; disabled until real SMTP is provisioned
    # so /actuator/health doesn't go DOWN and break Docker healthchecks.
    mail:
      enabled: false
