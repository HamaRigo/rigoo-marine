server:
  port: 8081
  base-url: ${SERVER_BASE_URL:http://localhost:8081}

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

  application:
    name: client-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rigoomarine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Connection pool settings (override via env vars)
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      # Connection leak detection (60 seconds)
      leak-detection-threshold: 60000
      # Health check
      connection-init-sql: SELECT 1
      # SSL settings (production enforced via DatabaseConfig)
      ssl-mode: ${DB_SSL_ENABLED:false} ? verify-full : prefer
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Security: prevent SQL injection via parameter binding
        order_inserts: true
        order_updates: true
    # Query timeout
    properties:
      hibernate:
        jdbc:
          timeout: ${DB_QUERY_TIMEOUT:30}
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour default TTL
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      database: 0
      ssl: ${REDIS_SSL_ENABLED:false}

# Database security settings
db:
  pool:
    max-size: ${DB_POOL_MAX_SIZE:20}
    min-idle: ${DB_POOL_MIN_IDLE:5}
    idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
    connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
    max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
  ssl:
    enabled: ${DB_SSL_ENABLED:false}
    root-cert: ${DB_SSL_ROOT_CERT:}
  query-timeout: ${DB_QUERY_TIMEOUT:30000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.rigoomarine.client: DEBUG

jwt:
  secret: ${JWT_SECRET:rigoo-marine-secret-key-change-in-production-12345}
  expiration: 86400000
